<!DOCTYPE html>
<html>

<head>
  <title>To-Do List</title>
  <link rel="stylesheet" href="To-Do.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <div class="top-part">
    <h2 style="margin-left: 13px;">Dashboard</h2>
    <p class="search-box">Search your task here</p>
    <img class="search-icon" src="Search.png" alt="search">
    <img class="calendar-icon" src="Calendar.png" alt="calendar">
    <div class="day">
      <p style="margin-bottom: 0px;"><b>Tuesday</b></p>
      <p style="margin-top: 0px;"><b>30/04/2026</b></p>
    </div>
  </div>
  <div class="bottom-part">
    <div class="left-part">
      <div class="profile">
        <img src="Profile.png" alt="profile">
        <h3><b>Jeva</b></h3>
      </div>
      <div class="options">
        <h3 class="dashboard">Dashboard</h3>
        <h3>My Task</h3>
        <h3>Task Categories</h3>
        <h3>Settings</h3>
        <h3>Help</h3>
      </div>
    </div>
    <div class="right-part">
      <div class="left">
        <div class="details"></div>
        <div class="today-tasks">
          <div class="task-1"></div>
          <div class="task-2"></div>
          <div class="task-3"></div>
        </div>
      </div>
      <div class="right">
        <div class="status"></div>
        <div class="completed-tasks">
          <div class="comp_task-1"></div>
          <div class="comp_task-2"></div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
